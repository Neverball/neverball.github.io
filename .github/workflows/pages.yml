name: Deploy Neverball

on:
  repository_dispatch:
    types: [deploy-web]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Neverball/neverball workflow run ID to deploy (optional, defaults to latest)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Build Artifact from Neverball/neverball
        run: |
          RUN_ID="${{ github.event.client_payload.run_id || github.event.inputs.run_id }}"
          if [ -n "$RUN_ID" ]; then
            echo "Downloading artifact from run ID: $RUN_ID"
            gh run download "$RUN_ID" --repo Neverball/neverball --name neverball-web --dir ./public
          else
            echo "No run_id specified. Finding latest successful run on master..."
            LATEST_RUN_ID=$(gh run list --repo Neverball/neverball --workflow "web-deploy.yml" --branch master --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            echo "Downloading artifact from latest successful master run ID: $LATEST_RUN_ID"
            gh run download "$LATEST_RUN_ID" --repo Neverball/neverball --name neverball-web --dir ./public
          fi
        env:
          GH_TOKEN: ${{ secrets.WEB_DEPLOY_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
